# Cap the page cache's dirty data in bytes instead of as a share of RAM.
#
# The kernel defaults (10% / 20% of RAM) let several GB of writes pile up on a
# machine with lots of memory. On a slow SSD, flushing that much stalls the
# whole desktop — big copies, flatpak/rpm-ostree updates, podman pulls.
# Start background writeback at 256 MiB, throttle writers at 1 GiB.
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824
